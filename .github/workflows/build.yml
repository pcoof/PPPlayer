name: Build & Release
# ========== Workflow Core Skills ==========
# 1. 版本自动生成 YYYYMMDD.N 自增
# 2. Python uv 项目版本自动同步更新（pyproject.toml + main.py __version__）
# 3. 跨 Ubuntu/Windows/macOS 多平台并行构建
# 4. Python wheel/sdist + Windows 桌面单目录二进制打包
# 5. 项目安装包构建（PyInstaller onedir → zip）
# 6. 自动压缩归档、制品持久化
# 7. 自动提交版本变更、创建 Git Tag
# 8. 自动生成变更日志并发布 GitHub Release
# ==========================================

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

env:
  VERSION_DATE: ${{ github.run_date }}
  GIT_USER_NAME: github-actions[bot]
  GIT_USER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  DIST_DIR: ./dist
  CACHE_KEY: ${{ github.workflow }}-${{ github.ref_name }}

jobs:
  # Skill: 计算当日自增版本 YYYYMMDD.N（检索同日已存在 Tag，取最大序号 +1）
  calc-version:
    runs-on: ubuntu-latest
    outputs:
      full_version: ${{ steps.gen_version.outputs.full_version }}
      date_prefix: ${{ steps.gen_version.outputs.date_prefix }}
      serial_num: ${{ steps.gen_version.outputs.serial_num }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-tags: true

      - name: Generate date prefix YYYYMMDD
        id: date_calc
        run: |
          echo "DATE_PREFIX=$(date +%Y%m%d)" >> $GITHUB_ENV

      - name: Count same date tag serial number
        id: gen_version
        run: |
          DATE_PREFIX=${{ env.DATE_PREFIX }}
          TAGS=$(git tag --list "v${DATE_PREFIX}.*")
          MAX_SERIAL=0
          for tag in $TAGS; do
            SERIAL=$(echo $tag | cut -d'.' -f2)
            if [[ $SERIAL -gt $MAX_SERIAL ]]; then
              MAX_SERIAL=$SERIAL
            fi
          done
          NEW_SERIAL=$((MAX_SERIAL + 1))
          FULL_VERSION="${DATE_PREFIX}.${NEW_SERIAL}"
          echo "date_prefix=${DATE_PREFIX}" >> $GITHUB_OUTPUT
          echo "serial_num=${NEW_SERIAL}" >> $GITHUB_OUTPUT
          echo "full_version=${FULL_VERSION}" >> $GITHUB_OUTPUT
          echo "Calculated Version: v${FULL_VERSION}"

  # Skill: 自动更新 pyproject.toml / main.py 版本并提交（Python uv 生态）
  update-version-file:
    needs: calc-version
    runs-on: ubuntu-latest
    env:
      FULL_VER: ${{ needs.calc-version.outputs.full_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Git identity
        run: |
          git config --global user.name "${{ env.GIT_USER_NAME }}"
          git config --global user.email "${{ env.GIT_USER_EMAIL }}"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"

      - name: Update pyproject.toml version
        if: hashFiles('pyproject.toml') != ''
        run: |
          pip install toml
          python - <<EOF
          import toml
          data = toml.load("pyproject.toml")
          data["project"]["version"] = "${{ env.FULL_VER }}"
          with open("pyproject.toml", "w", encoding="utf-8") as f:
              toml.dump(data, f)
          EOF

      - name: Sync main.py __version__
        if: hashFiles('main.py') != ''
        run: |
          python - <<'PY'
          import re
          p = "main.py"
          s = open(p, encoding="utf-8").read()
          s = re.sub(r'^__version__\s*=\s*["\'][^"\']*["\']', '__version__ = "${{ env.FULL_VER }}"', s, flags=re.M)
          open(p, "w", encoding="utf-8").write(s)
          PY

      - name: Commit version changes
        run: |
          git add pyproject.toml main.py || true
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: bump version to v${{ env.FULL_VER }} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

  # Skill: 跨平台并行构建 + 差异化打包 + 自动压缩归档
  build-package:
    needs: [calc-version, update-version-file]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact-suffix: linux
          - os: windows-latest
            artifact-suffix: win
          - os: macos-latest
            artifact-suffix: macos
    env:
      FULL_VER: ${{ needs.calc-version.outputs.full_version }}
      ARTIFACT_SUFFIX: ${{ matrix.artifact-suffix }}
    steps:
      - name: Checkout (含版本变更提交)
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      # Python uv Build Skill：跨平台产出 wheel + sdist
      - name: Setup Python + uv
        if: hashFiles('pyproject.toml') != ''
        uses: astral-sh/setup-uv@v3
        with:
          version: latest
          python-version: "3.13"

      - name: Python build wheel & sdist
        if: hashFiles('pyproject.toml') != ''
        run: uv build --out-dir ${{ env.DIST_DIR }}

      # 桌面独立二进制（Windows 专属）：单文件便携版 + 安装包
      - name: Build Windows portable single-file exe
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          uv venv
          uv pip install -r requirements.txt
          uv run pyinstaller --onefile --noconsole --icon=logo.ico --name=tsplayer-win `
            --add-data "static;static" `
            --hidden-import clr --hidden-import pythonnet `
            --hidden-import webview.platforms.edgechromium --hidden-import webview.platforms.winforms `
            --hidden-import src --hidden-import src.server --hidden-import src.config_store `
            --hidden-import src.parser.sniffer --hidden-import src.parser.m3u8_filter `
            --hidden-import src.cms --hidden-import src.cms.detector --hidden-import src.cms.base `
            --hidden-import src.cms.apple_cms --hidden-import src.cms.feifei_cms `
            --hidden-import src.cms.haiyang_cms --hidden-import src.cms.endpoint `
            --collect-all pythonnet `
            main.py --noconfirm --clean
          if (-not (Test-Path dist/tsplayer-win.exe)) { throw "PyInstaller build failed" }
          New-Item -ItemType Directory -Force -Path archive | Out-Null
          Copy-Item dist/tsplayer-win.exe archive/tsplayer-win.exe
          Compress-Archive -Force -Path dist/tsplayer-win.exe -DestinationPath archive/tsplayer-win-portable.zip

      - name: Build Windows installer (Inno Setup)
        if: matrix.os == 'windows-latest'
        uses: amake/innosetup-actions@v1
        with:
          file: installer.iss
          args: /dMyAppVersion=${{ env.FULL_VER }}

      # Archive Compress Skill：Linux/macOS 用 tar.gz，Windows 用 zip
      - name: Archive wheel/sdist (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p archive
          tar -czf archive/build-${{ env.ARTIFACT_SUFFIX }}-${{ env.FULL_VER }}.tar.gz -C ${{ env.DIST_DIR }} .

      # Artifact Persist Skill
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ env.ARTIFACT_SUFFIX }}-${{ env.FULL_VER }}
          path: archive/

  # Skill: 创建 Tag、生成更新日志、发布 GitHub Release
  release:
    needs: [calc-version, build-package]
    runs-on: ubuntu-latest
    env:
      FULL_VER: ${{ needs.calc-version.outputs.full_version }}
    steps:
      - name: Checkout full repo
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-tags: true

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-assets

      - name: Setup Git identity & auth
        run: |
          git config --global user.name "${{ env.GIT_USER_NAME }}"
          git config --global user.email "${{ env.GIT_USER_EMAIL }}"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"

      - name: Create & push Git version tag
        run: |
          git fetch --tags origin
          TAG="v${{ env.FULL_VER }}"
          if git ls-remote --tags --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists remotely; deleting before recreate..."
            git push origin ":refs/tags/$TAG"
            git tag -d "$TAG" 2>/dev/null || true
          fi
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Auto generate changelog
        id: gen_changelog
        run: |
          echo "## Release v${{ env.FULL_VER }}" > CHANGELOG.md
          echo "Build Date: ${{ env.VERSION_DATE }}" >> CHANGELOG.md
          echo "### Changes" >> CHANGELOG.md
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          RANGE=$([ -n "$PREV" ] && echo "$PREV..HEAD" || echo "HEAD")
          git log --pretty=format:"- %s" $RANGE >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "changelog<<CHANGELOG_EOF" >> "$GITHUB_ENV"
          cat CHANGELOG.md >> "$GITHUB_ENV"
          echo "CHANGELOG_EOF" >> "$GITHUB_ENV"

      - name: Remove existing GitHub Release (idempotent re-run)
        run: |
          TAG="v${{ env.FULL_VER }}"
          REL_ID=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" | jq -r '.id // empty')
          if [ -n "$REL_ID" ]; then
            curl -s -X DELETE -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$REL_ID"
            echo "Deleted existing release $REL_ID"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.FULL_VER }}
          name: Release v${{ env.FULL_VER }}
          body: ${{ env.changelog }}
          files: ./release-assets/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
