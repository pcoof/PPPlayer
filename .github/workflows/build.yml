name: Build Windows EXE

on:
  # 打 tag（v1.0.0 等）自动发布 Release
  push:
    tags:
      - 'v*'
  # 也支持手动触发（Actions 页面 → Run workflow）
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: python -m PyInstaller build.spec --noconfirm --clean

      - name: Package artifact
        shell: pwsh
        run: Compress-Archive -Force -Path dist/TSPlayer -DestinationPath TSPlayer-windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TSPlayer-windows
          path: TSPlayer-windows.zip
          retention-days: 30

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: TSPlayer-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
