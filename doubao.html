<!DOCTYPE html>
<html lang="zh-CN">
<head>
<style>
.waterfall-wrap {
  position: relative;
  width: 100%;
}
.waterfall-item {
  position: absolute;
  width: calc(100% - 12px);
  background:#eef;
  border-radius:8px;
}
.waterfall-item img {
  width:100%;
  display:block;
}
</style>
</head>
<body>
<div class="waterfall-wrap" id="wrap">
  <div class="waterfall-item"><img src="https://picsum.photos/300/420"></div>
  <div class="waterfall-item"><img src="https://picsum.photos/300/210"></div>
  <div class="waterfall-item"><img src="https://picsum.photos/300/530"></div>
  <div class="waterfall-item"><img src="https://picsum.photos/300/330"></div>
  <div class="waterfall-item"><img src="https://picsum.photos/300/270"></div>
  <div class="waterfall-item"><img src="https://picsum.photos/300/460"></div>
</div>

<script>
const wrap = document.getElementById('wrap');
const gap = 12;        // gap 和 grid gap一致
const minColWidth = 224; // minmax最小宽度

// 执行瀑布流布局
function renderWaterfall() {
  const containerWidth = wrap.clientWidth;
  // 计算列数，等价 auto-fill minmax(224px,1fr)
  let colCount = Math.floor(containerWidth / minColWidth);
  if(colCount <= 0) colCount = 1;
  const colItemWidth = (containerWidth / colCount) - gap;

  // 获取所有卡片
  const items = Array.from(wrap.querySelectorAll('.waterfall-item'));
  // 每列当前高度数组
  const colHeights = new Array(colCount).fill(0);

  items.forEach(item => {
    item.style.width = colItemWidth + 'px';
    // 找到高度最小的列索引
    let minHeight = Math.min(...colHeights);
    let targetCol = colHeights.indexOf(minHeight);

    // 设置位置 left top
    item.style.left = targetCol * (colItemWidth + gap) + 'px';
    item.style.top = colHeights[targetCol] + 'px';

    // 更新该列高度（自身高度+间隙）
    colHeights[targetCol] += item.offsetHeight + gap;
  });

  // 设置容器总高度，撑开父盒子
  wrap.style.height = Math.max(...colHeights) + 'px';
}

// 图片加载完成后重排（图片不定高必须等图片load）
window.addEventListener('load', renderWaterfall);
// 窗口resize重排
window.addEventListener('resize', renderWaterfall);

// 如果动态追加数据，追加完调用 renderWaterfall()
</script>
</body>
</html>
