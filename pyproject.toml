[project]
name = "ppplayer"
version = "20260905.2"
description = "CMS api - 聚合播放器桌面应用"
requires-python = ">=3.11"
dependencies = [
 "pywebview>=6.0",
 "flask>=3.0",
 "requests>=2.31",
 "aiohttp>=3.9",
 "beautifulsoup4>=4.12",
 "lxml>=5.0",
 "m3u8>=4.0",
 "httpx>=0.27",
 "pyinstaller>=6.22.2",
]

[dependency-groups]
dev = []

[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [ "src",]

[tool.hatch.build.targets.sdist]
include = [ "src", "main.py", "static", "build.spec", "pyproject.toml",]
