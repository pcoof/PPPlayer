[project]
name = "tsplayer-pywebview"
version = "20260821.0"
description = "CMS Pro - 聚合播放器桌面应用"
requires-python = ">=3.11"
dependencies = [
    "pywebview>=5.0",
    "flask>=3.0",
    "requests>=2.31",
    "aiohttp>=3.9",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "m3u8>=4.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = []

# 构建后端：用于 `uv build` 产出 wheel / sdist（跨平台打包产物）
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
include = ["src", "main.py", "static", "build.spec", "requirements.txt", "pyproject.toml"]
